<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plot Listing</title>
    <link href="../vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f7f7; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Montserrat', sans-serif; }
        .login-card { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .login-card h2 { color: #8d99af; font-weight: 700; margin-bottom: 25px; text-align: center; }
        .btn-login { background: #8d99af; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 25px; transition: 0.3s; }
        .btn-login:hover { background: #afb7c5; }
        .back-home { display: block; text-align: center; margin-top: 15px; color: #aaa; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>LOGIN</h2>
        <form>
            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Email Address">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" placeholder="Password">
            </div>
            <button type="submit" class="btn-login">Login Sekarang</button>
            <a href="../index.html" class="back-home"> Kembali ke Beranda</a>
        </form>
    </div>
</body>
</html>
